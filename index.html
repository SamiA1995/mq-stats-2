<html>
    <head>
        <title>MQ Stats</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="input.css">
    </head>
    <body>
        <div id = "navigation">
            <li class = "navigation_item">Alerts</li>
            <li class = "navigation_item">Dashboard</li>
            <li class = "navigation_item">MQ Stats</li>
            <li class = "navigation_item">MQED</li>
        </div>
        
        <div id = "page_information">
            <p id = "page_information_text">Search for MQ objects</p>
        </div>

        <div id="search">
            <div id = "column_1">
                <div class="coolinput">
                    <label for="input" class="text">Object name:</label>
                    <input type="text" id="object" placeholder="e.g. BT.CL.TEST.01" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">Queue manager:</label>
                    <input type="text" id="queue_manager" placeholder="e.g. BT.QM.EMBC03D1" name="input" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">Object type:</label>
                    <input type="text" id="object_type" placeholder="e.g. QLOCAL" name="input" class="input">
                </div>
            </div>
            <div id = "column_2">
                <div class="coolinput">
                    <label for="input" class="text">Hostname:</label>
                    <input type="text" id="host" placeholder="e.g. blp02752086" name="input" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">Location:</label>
                    <input type="text" id="host_location" placeholder="e.g. Reigate" name="input" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">Platform:</label>
                    <input type="text" id="platform" placeholder="e.g. EMB EC" name="input" class="input">
                </div>
            </div>
            <div id = "column_2">
                <div class="coolinput">
                    <label for="input" class="text">Application:</label></label>
                    <input type="text" id="application" placeholder="e.g. Flowmanage" name="input" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">APP ID:</label>
                    <input type="text" id="app_id" placeholder="e.g. APP02752" name="input" class="input">
                </div>
                <div class="coolinput">
                    <label for="input" class="text">Environment:</label>
                    <input type="text" id="environment" placeholder="e.g. Production" name="input" class="input">
                </div>
            </div>
            <div id = "column_2">
                <button class="arc-btn-retro" id="search_button">
                    Search
                </button>
            </div>
        </div>

        <div id = "main_content">
            <div id = "table_panel">
                <table id = "results_table">
                    <th class = "first_column">Object Type</th>
                    <th class = "name_column">Name</th>
                    <th>Queue manager</th>
                    <th>Host</th>
                    <th>Location</th>
                    <th>Platform</th>
                    <th>Environment</th>
                    <th>Application</th>
                    <th id = "border-top-right-radius">APP ID</th>
                </table>
            </div>
